<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
</style>
<title>Run Plan 30K</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: satu kolom sempit seperti lembar race bib, kartu run = bib nomor dada, tab bawah.
   Warna: netral dingin + empat warna jenis run (merah sinyal, kuning, teal, indigo), cuma dipakai buat membedakan jenis. */
:root {
  --bg: #E8EBF0; --surface: #FFFFFF; --surface-2: #F1F3F7;
  --ink: #11151B; --ink-2: #4A5462; --ink-3: #7B8593; --line: #D2D8E0; --on-ink: #FFFFFF;
  --bib: #FFFFFF; --bib-ink: #11151B;
  --c-int: #D93A22; --c-tmp: #E59A00; --c-easy: #12877C; --c-long: #4F46D8;
  --t-int: #B72E18; --t-tmp: #8A5800; --t-easy: #0B6B62; --t-long: #4338CA;
  --ok: #1E8E4E;
  --display: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --text: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1116; --surface: #161B22; --surface-2: #1D242D;
    --ink: #EDF0F4; --ink-2: #A9B2BF; --ink-3: #7F8998; --line: #2B333E; --on-ink: #0D1116;
    --c-int: #FF6A50; --c-tmp: #F5B53D; --c-easy: #35C4B5; --c-long: #8F88FF;
    --t-int: #FF8A74; --t-tmp: #F5B53D; --t-easy: #35C4B5; --t-long: #A8A2FF;
    --ok: #4CC47E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1116; --surface: #161B22; --surface-2: #1D242D;
  --ink: #EDF0F4; --ink-2: #A9B2BF; --ink-3: #7F8998; --line: #2B333E; --on-ink: #0D1116;
  --c-int: #FF6A50; --c-tmp: #F5B53D; --c-easy: #35C4B5; --c-long: #8F88FF;
  --t-int: #FF8A74; --t-tmp: #F5B53D; --t-easy: #35C4B5; --t-long: #A8A2FF;
  --ok: #4CC47E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 120px;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.tab[hidden] { display: none; }
.tab { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 6px; }
.mark { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.sub { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }

.weeks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: -2px 0 -4px; }
.weeks::-webkit-scrollbar { display: none; }
.wk {
  position: relative; flex: 0 0 46px; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; color: var(--ink-2); padding: 0;
}
.wk[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.wk[data-now="true"] { border: 2px solid var(--ink); color: var(--ink); }
.wk[data-done="true"]::after {
  content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ok);
}
.wk[data-done="true"][aria-pressed="true"]::after { background: var(--on-ink); }

.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.whead { display: flex; flex-direction: column; gap: 10px; }
.wtitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wtitle h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.wtitle .nm { font-size: 17px; font-weight: 600; color: var(--ink-2); }
.focus { margin: 0; color: var(--ink-2); max-width: 60ch; text-wrap: pretty; }
.prog { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.prog .big { font-family: var(--display); font-weight: 700; font-size: 56px; line-height: .95; font-variant-numeric: tabular-nums; }
.prog .of { font-size: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 5px; min-width: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.range { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; color: var(--ink-2); text-transform: uppercase; }
.now { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 4px; background: var(--ink); color: var(--on-ink); font-size: 10px; letter-spacing: .12em; vertical-align: 3px; font-family: var(--text); font-weight: 700; }
.banner { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink-2); }
.banner b { color: var(--ink); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; align-self: flex-start; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dy { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 6px 0 7px; text-align: center; min-width: 0; position: relative; overflow: hidden; }
.dy .a { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.dy .d { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dy .l { font-size: 10px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.dy[data-t] { background: var(--surface); }
.dy[data-t] .l { color: var(--ink); }
.dy[data-t]::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c-int); }
.dy[data-t="tempo"]::before { background: var(--c-tmp); } .dy[data-t="easy"]::before { background: var(--c-easy); } .dy[data-t="long"]::before { background: var(--c-long); }
.dy[data-today="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.tip { margin: 0; font-size: 13px; color: var(--ink-2); padding: 8px 10px; border-left: 3px solid var(--c-tmp); background: var(--surface-2); border-radius: 0 8px 8px 0; }
.seqs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seq { border: 1px solid var(--line); border-radius: 9px; padding: 8px 4px 7px; text-align: center; position: relative; overflow: hidden; min-width: 0; }
.seq::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c-int); }
.seq[data-t="tempo"]::before { background: var(--c-tmp); } .seq[data-t="easy"]::before { background: var(--c-easy); } .seq[data-t="long"]::before { background: var(--c-long); }
.seq b { display: block; font-family: var(--display); font-size: 20px; text-transform: uppercase; padding-top: 3px; }
.seq span { font-size: 11px; font-weight: 600; color: var(--ink-2); }

.runs { display: flex; flex-direction: column; gap: 10px; }
.run {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) 48px; gap: 8px 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
}
.bib {
  position: relative; width: 64px; height: 80px; background: var(--bib); color: var(--bib-ink); border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(17,21,27,.14); text-align: center;
}
.bib .stripe { height: 9px; background: var(--c-int); }
.bib::before, .bib::after { content: ""; position: absolute; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: #CBD1D9; }
.bib::before { left: 6px; } .bib::after { right: 6px; }
.bib .lbl { display: block; margin-top: 8px; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-indent: .22em; color: #5C6572; }
.bib .no { display: block; font-family: var(--display); font-weight: 700; font-size: 46px; line-height: 1; margin-top: 2px; }
.run[data-type="interval"] .stripe { background: var(--c-int); }
.run[data-type="tempo"] .stripe { background: var(--c-tmp); }
.run[data-type="easy"] .stripe { background: var(--c-easy); }
.run[data-type="long"] .stripe { background: var(--c-long); }
.rbody { min-width: 0; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--t-int); }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c-int); }
.run[data-type="tempo"] .tag, .t[data-type="tempo"] .tag { color: var(--t-tmp); } .run[data-type="tempo"] .tag::before, .t[data-type="tempo"] .tag::before { background: var(--c-tmp); }
.run[data-type="easy"] .tag, .t[data-type="easy"] .tag { color: var(--t-easy); } .run[data-type="easy"] .tag::before, .t[data-type="easy"] .tag::before { background: var(--c-easy); }
.run[data-type="long"] .tag, .t[data-type="long"] .tag { color: var(--t-long); } .run[data-type="long"] .tag::before, .t[data-type="long"] .tag::before { background: var(--c-long); }
.main { margin: 5px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.meta { margin-top: 4px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chk {
  width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink-3); background: transparent; color: var(--on-ink);
  display: grid; place-items: center; padding: 0;
}
.chk svg { width: 24px; height: 24px; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.run.done .main { color: var(--ink-2); }

details.more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 4px; }
details.more > summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 40px;
  font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); margin-right: 4px; }
details.more[open] > summary::after { transform: rotate(-135deg); }
.inner { display: flex; flex-direction: column; gap: 14px; padding: 6px 0 4px; }
.parts { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.targets { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.targets dt { color: var(--ink-3); } .targets dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
input[type="text"], input[type="number"], input[type="date"], textarea {
  width: 100%; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); font-size: 16px; font-variant-numeric: tabular-nums;
}
textarea { height: 120px; padding: 10px 12px; resize: vertical; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; }
.card p { margin: 0; color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); font-weight: 600; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.warn { border-color: var(--c-int); color: var(--t-int); background: transparent; }
.blist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.blist li { display: flex; align-items: center; justify-content: space-between; min-height: 44px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.blist li:first-child { border-top: 0; }
.x { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink-3); font-size: 22px; line-height: 1; }

.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sum > div { padding: 2px 0 2px 12px; min-width: 0; border-left: 1px solid var(--line); }
.sum > div:first-child { padding-left: 0; border-left: 0; }
.sum .big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.sum .cap { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--text); font-size: 10px; fill: var(--ink-2); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.types { display: flex; flex-direction: column; gap: 12px; }
.types .t { display: flex; flex-direction: column; gap: 3px; }
.zones { display: grid; grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.zones .h { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.zones .n { font-weight: 600; font-size: 14px; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 14px; }
.rules b { color: var(--ink); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nav button { height: 54px; border: 0; background: transparent; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; border-radius: 10px; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; max-width: calc(100vw - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .25s ease; }
  .chk { transition: background .15s ease; }
}
@media (max-width: 380px) {
  .run { grid-template-columns: 56px minmax(0, 1fr) 44px; gap: 8px 10px; }
  .bib { width: 56px; height: 72px; } .bib .no { font-size: 40px; }
  .fields { gap: 6px; }
  .zones { grid-template-columns: 66px minmax(0, 1fr) minmax(0, 1fr); }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast"><span class="mark">Run Plan 30K</span><span class="sub">Tanpa batas · 4 run inti</span></header>

  <main id="tab-week" class="tab">
    <nav id="weeks" class="weeks" aria-label="Pilih minggu"></nav>
    <section id="whead" class="whead"></section>
    <section id="sched" class="card"></section>
    <section id="runs" class="runs"></section>
    <section id="bonus" class="card"></section>
  </main>

  <main id="tab-progress" class="tab" hidden></main>
  <main id="tab-guide" class="tab" hidden></main>
</div>

<nav class="nav" aria-label="Menu utama"><div class="in">
  <button type="button" data-act="tab" data-tab="week" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 4.9M3.5 12l1.2 1.2L7 10.9M3.5 18l1.2 1.2L7 16.9"/></svg>Minggu</button>
  <button type="button" data-act="tab" data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Progres</button>
  <button type="button" data-act="tab" data-tab="guide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Panduan</button>
</div></nav>
<div id="toast" class="toast" hidden></div>

<script>
/* Program tanpa batas: blok 4 minggu (3 naik + 1 pulih), jarak inti selalu 30 km per minggu.
   Urutan run dalam satu minggu (disusun coach, hard-easy):
   Run 1 Interval (kaki paling segar), Run 2 Easy (pulih), Run 3 Tempo, Run 4 Long (easy).
   Tes 5K masuk di minggu pulih tiap 8 minggu. */
var TYPES = {
  interval: {
    label: "Interval", color: "--c-int",
    what: "Ngebut pendek berulang, diselingi jogging santai. Ini yang paling ngangkat VO2max.",
    feel: "Keras banget tapi masih rapi. Rep terakhir harus selesai di pace yang sama dengan rep pertama.",
    zone: "3:55–4:15", hr: "bertahap"
  },
  easy: {
    label: "Easy", color: "--c-easy",
    what: "Lari santai buat bangun mesin aerobik. Bikin HR istirahat dan HR tidur makin adem.",
    feel: "Bisa ngobrol satu kalimat penuh tanpa ngos-ngosan.",
    zone: "5:30–5:55", hr: "118–135"
  },
  tempo: {
    label: "Tempo", color: "--c-tmp",
    what: "Lari tahan lama di pace yang 'enak tapi keras'. Naikin batas kecepatan sebelum badan mulai capek berat.",
    feel: "Cuma bisa ngomong 3 sampai 4 kata sekali ucap. Napas teratur, gak boleh ngos-ngosan.",
    zone: "4:30–4:45", hr: "145–155"
  },
  long: {
    label: "Long run", color: "--c-long",
    what: "Lari paling jauh minggu ini, pace easy. Bangun daya tahan dan efisiensi jantung.",
    feel: "Pelan dan stabil. Kalau di km terakhir masih kuat, itu tandanya pace-nya bener.",
    zone: "5:30–5:55", hr: "maks 138"
  }
};

function id(n) { return String(n).replace(".", ","); }
/* Jarak rep interval di pace ~4:06/km, dibulatkan ke 50 m. Jarak tempo di pace ~4:37/km. */
function repM(min) { return Math.round(min * 1000 / 4.1 / 50) * 50; }
function tmpKm(min) { return id(Math.round(min / 4.62 * 10) / 10); }
function half(x) { return Math.round(x * 2) / 2; }
function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }

var INT_STAGES = [
  { reps: [3,3,3,3], jog: 2, km: 6 },
  { reps: [3,3,3,3,3], jog: 2, km: 7 },
  { reps: [3,3,3,3,3,3], jog: 2, km: 8 },
  { reps: [4,4,4,4], jog: 3, km: 7 },

        '<div><div class="big">' + fmt(tot.km) + '</div><div class="cap">km program</div></div>' +
        '<div><div class="big">' + fmt(tot.bonus) + '</div><div class="cap">km bonus</div></div></div></section>' +
      '<section class="card"><h2>Km per minggu, minggu ' + first + "–" + (first + 7) + '</h2>' + svg +
        '<div class="legend"><span><i style="background:var(--ink)"></i>Program</span><span><i style="background:var(--ink-3);opacity:.55"></i>Bonus</span><span>Garis putus = target 30 km</span></div>' +
        (tot.runs + tot.bonus === 0 ? "<p>Grafik terisi sendiri setelah lo centang run di tab Minggu.</p>" : "") + "</section>" +
      '<section class="card"><h2>Cadangan data</h2>' +
        "<p>Data tersimpan di HP lo sendiri. Salin cadangannya sesekali dan simpan di Catatan, biar aman kalau aplikasi dihapus.</p>" +
        '<textarea id="bk" aria-label="Data cadangan" placeholder="Hasil salinan muncul di sini. Buat memulihkan, tempel cadangan di sini lalu ketuk Pulihkan."></textarea>' +
        '<div class="addrow"><button type="button" class="btn" data-act="copy">Salin cadangan</button><button type="button" class="btn ghost" data-act="restore">Pulihkan</button></div>' +
        '<button type="button" class="btn ' + (resetArmed ? "warn" : "ghost") + '" data-act="reset">' + (resetArmed ? "Yakin? Ketuk lagi untuk hapus semua" : "Hapus semua data") + "</button></section>";
  }

  function renderGuide() {
    var order = ["easy", "long", "tempo", "interval"];
    var types = order.map(function (k) {
      var T = TYPES[k];
      return '<div class="t" data-type="' + k + '"><span class="tag">' + esc(T.label) + "</span><span>" + esc(T.what) + '</span><span style="color:var(--ink-3)">' + esc(T.feel) + "</span></div>";
    }).join("");
    var names = { easy: "Easy", long: "Long run", tempo: "Tempo", interval: "Interval", bonus: "Santai" };
    var zrows = '<div class="h">Jenis</div><div class="h">Pace /km</div><div class="h">HR</div>';
    ["easy", "long", "tempo", "interval", "bonus"].forEach(function (k) {
      var z = zone(k);
      zrows += '<div class="n">' + names[k] + '</div>' +
        '<input type="text" data-z="' + k + '" data-zf="pace" value="' + esc(z.pace) + '" aria-label="Pace ' + names[k] + '">' +
        '<input type="text" data-z="' + k + '" data-zf="hr" value="' + esc(z.hr) + '" aria-label="HR ' + names[k] + '">';
    });
    $("tab-guide").innerHTML =
      '<section class="card"><h2>4 jenis run</h2><div class="types">' + types + "</div></section>" +
      '<section class="card"><h2>Zona lo</h2><p>Angka awal dari data lari lo. Pace tempo dan interval itu perkiraan: kalau di rep terakhir interval lo masih ngerasa bisa 2 rep lagi, pace-nya kurang cepat. Kalau tempo bikin lo ngos-ngosan sebelum separuh jalan, pace-nya terlalu cepat. Ubah angkanya di sini, kartu run ikut berubah.</p>' +
        '<div class="zones">' + zrows + '</div><button type="button" class="btn ghost" data-act="zreset">Kembalikan ke angka awal</button></section>' +
      '<section class="card"><h2>Aturan coach</h2><ol class="rules">' +
        "<li><b>Urutan Run 1 sampai 4 jangan ditukar.</b> Run 1 interval dan Run 3 tempo butuh kaki segar. Harinya bebas lo atur.</li>" +
        "<li><b>Minimal 1 hari tanpa olahraga berat tiap minggu</b>, idealnya sebelum Run 1. Di situ HR tidur dan HRV pulih.</li>" +
        "<li><b>Jeda minimal 1 hari antar run.</b> Leg day jangan sehari sebelum Run 1 atau Run 3.</li>" +
        "<li><b>Run terlewat jangan dikejar dobel.</b> Kalau interval atau tempo kelewat lebih dari 2 hari, lewati dan lanjut ke run berikutnya. Prioritas kalau waktu mepet: Run 1 dan Run 4.</li>" +
        "<li><b>Pantau HR run easy.</b> Kalau HR di pace yang sama naik 5 bpm atau lebih selama beberapa hari, turunkan sesi cepat berikutnya jadi easy.</li>" +
        "<li><b>Siklus 4 minggu:</b> 3 minggu naik, 1 minggu pulih. Minggu pulih jangan diisi bonus banyak.</li>" +
        "<li><b>Tes 5K tiap 8 minggu.</b> Pace hasil tes dipakai buat memperbarui zona di atas, supaya program ikut naik seiring lo makin kuat. Program ini jalan terus tanpa akhir.</li>" +
        "<li><b>Km di luar 30</b> catat di kartu Bonus, pakai lari santai pelan.</li></ol></section>" +
      '<section class="card"><h2>Tanggal mulai</h2><p>Minggu 1 dimulai di Senin yang lo pilih. Tanggal yang dipilih otomatis dibulatkan ke Senin dalam minggu itu. Rentang tanggal tiap minggu ngikutin tanggal ini.</p>' +
        '<div class="addrow"><input id="startDate" type="date" value="' + iso(startDate()) + '" aria-label="Tanggal mulai program"><button type="button" class="btn" data-act="setstart">Terapkan</button></div></section>';
  }

  function setTab(t) {
    tab = t;
    ["week", "progress", "guide"].forEach(function (k) { $("tab-" + k).hidden = k !== t; });
    var bs = document.querySelectorAll(".nav button");
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].getAttribute("data-tab") === t) bs[i].setAttribute("aria-current", "page"); else bs[i].removeAttribute("aria-current");
    }
    if (t === "progress") renderProgress();
    if (t === "guide") renderGuide();
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act !== "reset") resetArmed = false;
    if (act === "tab") { setTab(el.getAttribute("data-tab")); }
    else if (act === "week") { S.week = +el.getAttribute("data-w"); renderWeekTab(); }
    else if (act === "now") { S.week = curWeek() || 1; renderWeekTab(); }
    else if (act === "setstart") {
      var dv = parseIso($("startDate").value);
      if (!dv) { toast("Pilih tanggal dulu"); return; }
      S.start = iso(mondayOf(dv)); save(); S.week = curWeek() || 1; renderWeekTab(); renderGuide(); toast("Minggu 1 mulai " + dlong(mondayOf(dv)));
    }
    else if (act === "toggle") {
      var w = +el.getAttribute("data-w"), n = +el.getAttribute("data-n"), k = rk(w, n);
      var e = S.done[k] || (S.done[k] = {});
      e.on = !e.on; save(); renderWeekTab();
    }
    else if (act === "addbonus") {
      var inp = $("bonusKm"), v = num(inp.value);
      if (!v) { toast("Isi jarak dulu, contoh 5,2"); return; }
      var key = "w" + S.week; (S.bonus[key] = S.bonus[key] || []).push({ km: v });
      save(); renderHead(); renderBonus(); renderWeeks();
    }
    else if (act === "delbonus") {
      var list = S.bonus["w" + S.week] || []; list.splice(+el.getAttribute("data-i"), 1);
      save(); renderHead(); renderBonus();
    }
    else if (act === "copy") {
      var box = $("bk"), txt = JSON.stringify(S);
      box.value = txt;
      var fallback = function () { box.focus(); box.select(); toast("Tahan lalu pilih Salin"); };
      try { navigator.clipboard.writeText(txt).then(function () { toast("Cadangan tersalin"); }, fallback); } catch (err) { fallback(); }
    }
    else if (act === "restore") {
      var raw = $("bk").value.trim();
      try {
        var o = JSON.parse(raw);
        if (!o || typeof o !== "object" || !o.done) throw new Error("x");
        S.done = o.done || {}; S.bonus = o.bonus || {}; S.zones = o.zones || {}; S.start = typeof o.start === "string" && parseIso(o.start) ? o.start : S.start;
        save(); S.week = curWeek() || 1; renderWeekTab(); renderProgress(); toast("Data dipulihkan");
      } catch (err) { toast("Format cadangan gak valid"); }
    }
    else if (act === "reset") {
      if (!resetArmed) { resetArmed = true; renderProgress(); setTimeout(function () { resetArmed = false; if (tab === "progress") renderProgress(); }, 4000); }
      else { S = { done: {}, bonus: {}, zones: {}, start: iso(defaultStart()), week: 1 }; S.week = curWeek() || 1; openSet = {}; resetArmed = false; save(); renderWeekTab(); renderProgress(); toast("Semua data dihapus"); }
    }
    else if (act === "zreset") { S.zones = {}; save(); renderGuide(); renderRuns(); renderBonus(); toast("Zona dikembalikan"); }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute("data-f")) {
      var k = t.getAttribute("data-k"), e = S.done[k] || (S.done[k] = {});
      e[t.getAttribute("data-f")] = t.value.trim(); save();
      renderHead(); renderWeeks();
      var m = /^w(\d+)r(\d+)$/.exec(k), card = document.querySelector('.run[data-k="' + k + '"]');
      if (m && card) {
        var r = planWeek(+m[1]).runs[+m[2] - 1], out = card.querySelector(".km-out");
        out.innerHTML = kmText(+m[1], +m[2], r, e.on);
      }
    } else if (t.getAttribute && t.getAttribute("data-z")) {
      var z = t.getAttribute("data-z"); S.zones[z] = S.zones[z] || {};
      S.zones[z][t.getAttribute("data-zf")] = t.value.trim(); save(); renderRuns(); renderBonus();
    }
  });
  document.addEventListener("toggle", function (ev) {
    var d = ev.target;
    if (d && d.matches && d.matches("details.more")) {
      var k = d.getAttribute("data-k"); if (d.open) openSet[k] = 1; else delete openSet[k];
    }
  }, true);

  load();
  if (!parseIso(S.start)) { S.start = iso(defaultStart()); save(); }
  S.week = curWeek() || 1;
  renderWeekTab();
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>

</body></html>
